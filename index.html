<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyWebsite</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Outfit:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="nav-container">
      <nav>
        <img src="assets/kydev.png" alt="Logo" class="logo" />
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>

    <section id="hero" class="hero-section">
      <div class="hero-content">
        <div class="hero-text">
          <h1>Hi, I'm <span class="highlight">Kydev</span></h1>
          <p>
            Web Developer passionate about building clean, fast, and modern
            digital solutions.
          </p>
          <div class="hero-buttons">
            <button id="btn1" class="btn-start">Get Started</button>
            <button id="btn2" class="btn-learn">Learn More</button>
          </div>
        </div>
        <div class="hero-image">
          <img src="assets/programmer.png" alt="Hero Image" />
        </div>
      </div>
    </section>

    
  </body>
</html>
